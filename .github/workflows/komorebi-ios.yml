name: Komorebi iOS
on:
  push:
    paths: ['aigake/app/**', 'aigake/walk/**', 'aigake/experiments/voxel-walk-lab-20260909/**', 'aigake/vendor/three/**', '.github/workflows/komorebi-ios.yml']
  pull_request:
    paths: ['aigake/app/**', 'aigake/walk/**', 'aigake/experiments/voxel-walk-lab-20260909/**', 'aigake/vendor/three/**', '.github/workflows/komorebi-ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload the app and widget to TestFlight
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: komorebi-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      KOMOREBI_DEBUG_TOOLS: ${{ inputs.testflight && '0' || '1' }}
    defaults:
      run:
        working-directory: aigake/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aigake/app/package-lock.json
      - name: Select Xcode 26
        run: |
          python3 - <<'PY'
          import glob, os, re
          paths = glob.glob('/Applications/Xcode_26*.app/Contents/Developer')
          if not paths: raise SystemExit('Xcode 26 is required')
          selected = sorted(paths, key=lambda p: tuple(map(int,re.findall(r'\d+',p))))[-1]
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('DEVELOPER_DIR='+selected+'\n')
          PY
      - run: npm ci
      - run: npm run test:walk
      - run: npm run sync:ios
      - run: npm run verify:ios
      - name: Check Swift widget data model
        run: |
          swiftc ios/App/Shared/WidgetSnapshot.swift scripts/widget-model-check.swift -o "$RUNNER_TEMP/widget-model-check"
          "$RUNNER_TEMP/widget-model-check"
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Resolve native dependencies
        run: |
          plutil -lint ios/App/App/Info.plist ios/App/App/App.entitlements ios/App/KomorebiWidget/Info.plist ios/App/KomorebiWidget/KomorebiWidget.entitlements ios/App/App/PrivacyInfo.xcprivacy ios/App/App.xcodeproj/project.pbxproj
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Build app and widget without signing
        if: ${{ !inputs.testflight }}
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/komorebi-derived" -resultBundlePath "$RUNNER_TEMP/Unsigned.xcresult" CODE_SIGNING_ALLOWED=NO build
          test -d "$RUNNER_TEMP/komorebi-derived/Build/Products/Debug-iphonesimulator/App.app/PlugIns/KomorebiWidget.appex"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/komorebi-derived/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/Komorebi-Simulator.zip"
      - name: Save simulator build
        if: ${{ !inputs.testflight && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Komorebi-Simulator
          path: ${{ runner.temp }}/Komorebi-Simulator.zip
          retention-days: 7
      - name: Build unsigned iPhone app and widget
        if: ${{ !inputs.testflight }}
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/komorebi-device" -resultBundlePath "$RUNNER_TEMP/UnsignedDevice.xcresult" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          python3 scripts/package-sideload.py --app "$RUNNER_TEMP/komorebi-device/Build/Products/Release-iphoneos/App.app" --output "$RUNNER_TEMP/komorebi-sideload"
      - name: Save Sideloadly IPA
        if: ${{ !inputs.testflight && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Komorebi-iPhone-Unsigned
          path: ${{ runner.temp }}/komorebi-sideload/
          if-no-files-found: error
          retention-days: 14
      - name: Install signing assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in P12_BASE64 P12_PASSWORD PROFILE_BASE64 WIDGET_PROFILE_BASE64 APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64; do
            if [ -z "${!name}" ]; then echo "Missing secret: $name"; exit 1; fi
          done
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$WIDGET_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/widget.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/app-profile.plist"
          security cms -D -i "$RUNNER_TEMP/widget.mobileprovision" > "$RUNNER_TEMP/widget-profile.plist"
          python3 scripts/prepare-signing.py
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/app-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/app-signing.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/app-signing.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/app-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$RUNNER_TEMP/app-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/app-signing.keychain-db" login.keychain-db
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive and export app with widget
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Komorebi.xcarchive" -resultBundlePath "$RUNNER_TEMP/Archive.xcresult" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' KOMOREBI_APP_PROFILE="$APP_PROFILE_UUID" KOMOREBI_WIDGET_PROFILE="$WIDGET_PROFILE_UUID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
          test -d "$RUNNER_TEMP/Komorebi.xcarchive/Products/Applications/App.app/PlugIns/KomorebiWidget.appex"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Komorebi.xcarchive" -exportPath "$RUNNER_TEMP/komorebi-ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: xcrun altool --upload-app -f "$RUNNER_TEMP/komorebi-ipa/App.ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Save build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-build-diagnostics
          path: |
            ${{ runner.temp }}/Unsigned.xcresult
            ${{ runner.temp }}/UnsignedDevice.xcresult
            ${{ runner.temp }}/Archive.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove signing assets
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/widget.mobileprovision" "$RUNNER_TEMP/app-profile.plist" "$RUNNER_TEMP/widget-profile.plist" "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          for uuid in "${APP_PROFILE_UUID:-}" "${WIDGET_PROFILE_UUID:-}"; do
            if [ -n "$uuid" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"; fi
          done
