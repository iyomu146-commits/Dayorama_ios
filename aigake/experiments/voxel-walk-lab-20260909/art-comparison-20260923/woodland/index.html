<header><a href="../coarse.html">Dayorama</a><strong>林間の町</strong><button id="reference" aria-pressed="false">原案</button></header>
<nav aria-label="見る対象"><button data-asset="town" aria-pressed="true">全景</button><button data-asset="home">住宅</button><button data-asset="bakery">パン屋</button><button data-asset="books">本屋</button><button data-asset="florist">花屋</button><button data-asset="cafe">喫茶店</button><button data-asset="tree">樹木</button><button data-asset="flowers">植栽</button><button data-asset="bridge">橋</button></nav>
