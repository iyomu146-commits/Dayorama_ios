<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dayorama — 15cmの喫茶店</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./coarse.css"><script type="importmap">{"imports":{"three":"../../../vendor/three/three.module.js","three/addons/":"../../../vendor/three/examples/jsm/"}}</script></head>
<body><header><a href="./">Dayorama</a><span>15cmの喫茶店</span><a class="editor-link" href="./density.html?model=crafted">編集する</a></header><main>
<div class="toolbar"><div class="segmented" aria-label="模型"><button data-model="crafted" aria-pressed="true">新しい喫茶店</button><button data-model="resampled" aria-pressed="false">以前の縮約版</button></div><div class="tools"><select id="angle" aria-label="視点"><option value="corner">斜め</option><option value="front">正面</option><option value="back">背面</option><option value="top">上から</option></select><button id="night" aria-pressed="false">夜</button></div></div>
<section class="model-stage"><div id="view" aria-label="喫茶店。ドラッグで回転、ピンチで拡大。"></div><div id="loading" role="status">準備中…</div><div class="view-tools"><button id="zoom-out" aria-label="縮小">−</button><button id="zoom-in" aria-label="拡大">＋</button><button id="fit">全体</button></div><div class="model-info"><span id="count">—</span><span>1粒 15cm · 主屋の幅32粒</span></div></section>
<section class="construction"><div class="progress-title"><button id="play" aria-label="建築を再生">▶</button><strong id="step-value">20,000歩</strong><span id="phase">完成</span><button id="reset">はじめから</button></div><input id="steps" type="range" min="0" max="20000" value="20000" step="250" aria-label="建築の歩数"><div class="milestones"><button data-step="2000">基礎</button><button data-step="6000">骨組み</button><button data-step="12000">壁・窓</button><button data-step="17000">屋根</button><button data-step="20000">完成</button></div></section>
<details class="details"><summary>模型の情報</summary><p id="description">15cmの格子上で直接設計した喫茶店。窓の中央に枠はなく、テラス席は建物の横に置いています。全ての形をボクセルとして編集できます。</p><p id="metrics"></p><p>以前の版とは光・材質・カメラを共通にしています。敷地の広さと形は異なります。iPhone実機の負荷は未測定です。</p><button id="export">作品を書き出す</button></details>
</main><script type="module" src="./coarse-app.mjs"></script></body></html>
